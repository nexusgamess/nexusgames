<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Ayuda | NexusGames</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="juegos/imagenes/IDENTIDAD.png">

    <style>
        /* DEFINIMOS TU ROJO NEXUS PERSONALIZADO */
        :root {
            --rojo-nexus: #D50000; /* Un rojo puro y vibrante */
            --rojo-oscuro: #cc0000;
        }

        .bg-nexus { background-color: var(--rojo-nexus) !important; }
        .text-nexus { color: var(--rojo-nexus) !important; }
        .border-nexus { border-color: var(--rojo-nexus) !important; }
        
        .btn-nexus {
            background-color: var(--rojo-nexus);
            color: white;
            border: none;
            transition: 0.3s;
        }

        .btn-nexus:hover {
            background-color: var(--rojo-oscuro);
            color: white;
            transform: translateY(-2px);
        }

        .btn-outline-nexus {
            border: 2px solid var(--rojo-nexus);
            color: var(--rojo-nexus);
            background: transparent;
            transition: 0.3s;
        }

        .btn-outline-nexus:hover {
            background-color: var(--rojo-nexus);
            color: white;
        }

        .card-header-nexus {
            background-color: var(--rojo-nexus);
            color: white;
        }

        .badge-nexus {
            background-color: var(--rojo-nexus);
            color: white;
        }

        /* Ajuste para que los inputs se vean pro */
        .form-control:focus {
            border-color: var(--rojo-nexus);
            box-shadow: 0 0 0 0.25rem rgba(255, 0, 0, 0.25);
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-nexus shadow-sm">
        <div class="container">
            <a class="navbar-brand text-white fw-bold fs-4 d-flex align-items-center" href="index.html">
                <img src="juegos/imagenes/IDENTIDAD.png" alt="Logo" style="height: 35px;" class="me-2">
                NEXUSGAMES
            </a>
            <div class="collapse navbar-collapse" id="menuAyuda">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 fw-semibold">
                    <li class="nav-item"><a class="nav-link text-white" href="index.html"><i class="fa-solid fa-house me-1"></i> Inicio</a></li>
                    <li class="nav-item"><a class="nav-link text-white active border-bottom border-white" href="ayuda.html"><i class="fa-solid fa-circle-question me-1"></i> Ayuda</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="bg-dark text-white py-4 mb-4 border-bottom border-nexus border-4">
        <div class="container text-center">
            <h1 class="fw-bold"><i class="fa-solid fa-headset text-nexus me-2"></i> CENTRO DE AYUDA Y SOPORTE</h1>
            <p class="text-muted mb-0">¿Tienes problemas con la instalación o algún error? ¡Comenta abajo!</p>
        </div>
    </div>

    <div class="container mb-5">
        <div class="row g-4">
            
            <div class="col-lg-5">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header card-header-nexus fw-bold text-center py-3">
                        <i class="fa-solid fa-pen-to-square me-2"></i> PUBLICAR UNA CONSULTA
                    </div>
                    <div class="card-body p-4">
                        <form id="formComentario">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Tu Nombre o Apodo:</label>
                                <input type="text" id="nombreUsuario" class="form-control border-nexus" placeholder="Ej. NedFlow" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark" for="juegoSeleccionado">¿Con qué juego necesitas ayuda?</label>
                                <input class="form-control border-nexus" list="lista-juegos" id="juegoSeleccionado" placeholder="Escribe o selecciona un juego..." required>
                                <datalist id="lista-juegos">
                                    <option value="Consulta General / Otro"></option>
                                    </datalist>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Tu problema o duda:</label>
                                <textarea id="mensajeComentario" class="form-control border-nexus" rows="4" placeholder="Explica detalladamente qué ayuda necesitas..." required></textarea>
                            </div>

                            <button type="submit" class="btn btn-nexus w-100 fw-bold py-2 shadow-sm text-uppercase">
                                <i class="fa-solid fa-paper-plane me-2"></i> ENVIAR COMENTARIO
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center">
                        <span><i class="fa-solid fa-comments text-nexus me-2"></i> COMENTARIOS RECIENTES</span>
                        <span class="badge badge-nexus" id="contadorComentarios">0 Comentarios</span>
                    </div>
                    <div class="card-body p-4 bg-light" id="listaComentarios" style="max-height: 600px; overflow-y: auto;">
                        </div>
                </div>
            </div>

        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0 text-muted small">&copy; 2026 NexusGames. Todos los derechos reservados.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            // --- CARGAR LISTA DE JUEGOS DINÁMICAMENTE ---
            fetch('/api/juegos')
                .then(response => response.json())
                .then(juegos => {
                    const dataList = document.getElementById('lista-juegos');
                    juegos.forEach(juego => {
                        const option = document.createElement('option');
                        option.value = juego.titulo;
                        dataList.appendChild(option);
                    });
                })
                .catch(error => console.error('Error al cargar la lista de juegos:', error));

            // --- LÓGICA DE COMENTARIOS ---
            const formComentario = document.getElementById('formComentario');
            const listaComentarios = document.getElementById('listaComentarios');
            const contadorComentarios = document.getElementById('contadorComentarios');

            let comentarios = JSON.parse(localStorage.getItem('nexus_comentarios')) || [];

            function guardarComentarios() {
                localStorage.setItem('nexus_comentarios', JSON.stringify(comentarios));
            }

            function renderizarComentarios() {
                listaComentarios.innerHTML = "";
                let total = comentarios.length;
                comentarios.forEach(c => total += c.respuestas.length);
                contadorComentarios.textContent = `${total} Comentarios`;

                comentarios.forEach((com) => {
                    let respuestasHTML = "";
                    com.respuestas.forEach((resp) => {
                        respuestasHTML += `
                            <div class="bg-white p-3 rounded-3 mt-2 border-start border-nexus border-3 shadow-sm">
                                <div class="d-flex justify-content-between">
                                    <span class="fw-bold text-nexus" style="font-size: 0.9rem;"><i class="fa-solid fa-reply me-1"></i> ${resp.nombre}</span>
                                    <small class="text-muted" style="font-size: 0.7rem;">${resp.fecha}</small>
                                </div>
                                <p class="mb-0 text-dark small">${resp.mensaje}</p>
                            </div>
                        `;
                    });

                    const tarjetaHTML = `
                        <div class="card mb-3 border-0 shadow-sm">
                            <div class="card-body">
                                <div class="d-flex justify-content-between">
                                    <h6 class="fw-bold text-dark mb-1"><i class="fa-solid fa-circle-user text-muted me-1"></i> ${com.nombre}</h6>
                                    <small class="text-muted" style="font-size: 0.7rem;">${com.fecha}</small>
                                </div>
                                <span class="badge badge-nexus mb-2" style="font-size: 0.7rem;">${com.juego}</span>
                                <p class="card-text text-dark mb-2" style="font-size: 0.95rem;">${com.mensaje}</p>
                                
                                <div class="text-end">
                                    <button class="btn btn-sm btn-outline-nexus" onclick="toggleFormRespuesta(${com.id})">Responder</button>
                                </div>

                                <div class="respuestas-contenedor">
                                    ${respuestasHTML}
                                </div>

                                <div id="form-resp-${com.id}" class="d-none mt-3 p-3 bg-white border rounded">
                                    <input type="text" id="nombre-resp-${com.id}" class="form-control form-control-sm mb-2" placeholder="Tu Nombre">
                                    <textarea id="msg-resp-${com.id}" class="form-control form-control-sm mb-2" rows="2" placeholder="Tu respuesta..."></textarea>
                                    <div class="text-end">
                                        <button class="btn btn-sm btn-nexus" onclick="agregarRespuesta(${com.id})">Enviar</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    listaComentarios.innerHTML += tarjetaHTML;
                });
            }

            formComentario.addEventListener('submit', function(e) {
                e.preventDefault();
                const nuevoComentario = {
                    id: Date.now(),
                    nombre: document.getElementById('nombreUsuario').value,
                    juego: document.getElementById('juegoSeleccionado').value,
                    mensaje: document.getElementById('mensajeComentario').value,
                    fecha: new Date().toLocaleString(),
                    respuestas: []
                };
                comentarios.unshift(nuevoComentario);
                guardarComentarios();
                renderizarComentarios();
                formComentario.reset();
            });

            window.toggleFormRespuesta = function(id) {
                document.getElementById(`form-resp-${id}`).classList.toggle('d-none');
            };

            window.agregarRespuesta = function(id) {
                const nombre = document.getElementById(`nombre-resp-${id}`).value;
                const mensaje = document.getElementById(`msg-resp-${id}`).value;
                if(!nombre || !mensaje) return alert("Completa los campos");

                const com = comentarios.find(c => c.id === id);
                com.respuestas.push({
                    nombre: nombre,
                    mensaje: mensaje,
                    fecha: new Date().toLocaleString()
                });
                guardarComentarios();
                renderizarComentarios();
            };

            renderizarComentarios();
        });
    </script>
</body>
</html>
